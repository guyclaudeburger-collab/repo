warning-message = "Ce site a été initialement composé par Guy-Claude Burger dans l'espoir d'introduire les concepts essentiels de l'instinctothérapie et de la métapsychanalyse au public en les dissociant de son nom et ses histoires judiciaires. Il n'a pas fallu longtemps pour que quelqu'un identifie l'auteur, et que ces préoccupations n'existent plus, j'ai réintroduit les termes originaux à l'exception des quelques articles introduisant les nouveaux."
